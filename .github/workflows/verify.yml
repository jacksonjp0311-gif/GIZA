name: GIZA verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/release/verify.mjs
      - id: dependencies
        run: node scripts/ci-stage.mjs dependencies
      - id: contracts
        run: node scripts/ci-stage.mjs contracts
      - id: compilation
        run: node scripts/ci-stage.mjs compilation
      - id: browserSetup
        run: node scripts/ci-stage.mjs browserSetup
      - id: browser
        run: node scripts/ci-stage.mjs browser
      - name: Compile and launch smoke (also after browser failure)
        if: ${{ always() && steps.compilation.outcome == 'success' }}
        run: node scripts/ci-stage.mjs smoke
        env:
          GIZA_EXPLORER_PORT: '4183'
          GIZA_PORT: '4184'
      - name: Preserve public verification artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            verification-ci/
            test-results/
            playwright-report/
